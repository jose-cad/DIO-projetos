<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Crédito de Carbono</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --bg-color: #121212;
      --primary-color: #7C3AED;
      --text-color: #FFFFFF;
    }
    /* Força o fundo escuro e o texto claro, prevenindo o erro de visibilidade */
    body {
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
    }
    h1 {
      /* Cor primária para o título principal */
      color: var(--primary-color) !important; 
      /* Redução adicional do tamanho da fonte do h1 (ajuste no CSS externo) */
    }
    .form-check-label i {
      color: var(--text-color);
    }
    /* Rodapé */
    .footer-dio {
        color: #aaaaaa;
        font-size: 0.8em; 
    }
  </style>
</head>
<body class="container py-2 d-flex flex-column min-vh-100"> <h1 class="mb-2">Calculadora de Crédito de Carbono</h1> <div class="mb-2">
    <label for="origem" class="form-label">Capital de Origem</label>
    <input type="text" id="origem" class="form-control" placeholder="Ex: São Paulo" list="capitais-list">
  </div>

  <div class="mb-3">
    <label for="destino" class="form-label">Capital de Destino</label>
    <input type="text" id="destino" class="form-control" placeholder="Ex: Rio de Janeiro" list="capitais-list">
  </div>

  <div class="mb-3">
    <label class="form-label">Meio de Transporte</label>
    <div class="d-flex flex-wrap gap-3">
      
      <div class="form-check">
        <input class="form-check-input" type="radio" name="transporte" id="bicicleta" value="bicicleta" checked>
        <label class="form-check-label" for="bicicleta">
          <i class="bi bi-bicycle"></i> Bicicleta
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="transporte" id="moto" value="moto">
        <label class="form-check-label" for="moto">
          <i class="bi bi-scooter"></i> Moto
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="transporte" id="carro" value="carro">
        <label class="form-check-label" for="carro">
          <i class="bi bi-car-front"></i> Carro
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="transporte" id="onibus" value="onibus">
        <label class="form-check-label" for="onibus">
          <i class="bi bi-bus-front"></i> Ônibus
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="transporte" id="caminhao" value="caminhao">
        <label class="form-check-label" for="caminhao">
          <i class="bi bi-truck"></i> Caminhão
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="transporte" id="aviao" value="aviao">
        <label class="form-check-label" for="aviao">
          <i class="bi bi-airplane"></i> Avião
        </label>
      </div>

    </div>
  </div>

  <button id="calcular" class="btn btn-primary w-100 mb-3"> Calcular Emissão de Carbono
  </button>

  <div class="resultado-panel p-2 mb-3 rounded"> <p class="mb-1"><strong>Emissão e Distância:</strong></p>
      <p class="resultado-text" id="resultado_emissao"></p>
      
      <p class="mb-1 mt-3"><strong>Custo de Compensação:</strong></p>
      <p class="resultado-text" id="resultado_custo"></p>
  </div>


  <datalist id="capitais-list"></datalist>

  <script src="scripts/script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <footer class="text-center mt-auto py-3 border-top border-secondary">
    <p class="footer-dio mb-0">Desenvolvido como projeto educacional DIO - Digital Innovation One.</p>
  </footer>
</body>
</html>
